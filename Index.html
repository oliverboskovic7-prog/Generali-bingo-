<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generali Bingo – SK majetek</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3ebdd;--bg2:#fbf6ec;--card:#fffdf8;--ink:#2a1a14;--mut:#7d675b;--red:#b3201f;--red2:#8f1514;--gold:#e2a817;--ok:#2e9160;--line:#e8dac4;--sh:0 2px 8px rgba(80,40,10,.10);--vio:#7a3bd1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--bg2:#241915;--card:#2c1f1a;--ink:#f6eadd;--mut:#bba698;--line:#4a372b;--sh:0 2px 8px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1a1210;--bg2:#241915;--card:#2c1f1a;--ink:#f6eadd;--mut:#bba698;--line:#4a372b;--sh:0 2px 8px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%);background-color:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.w{max-width:980px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--red2),#d23a33);color:#fff;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,212,90,.18)}
.hero h1{margin:0;font-size:28px;letter-spacing:.5px;line-height:1}.hero h1 span{color:#ffd45a}
.hero .sub{opacity:.9;font-size:13px;margin-top:4px}
.hero .l{flex:1;min-width:180px;position:relative;z-index:1}
.pts{background:rgba(0,0,0,.22);border-radius:16px;padding:8px 16px;text-align:center;z-index:1}
.pts b{display:block;font-size:30px;color:#ffd45a;line-height:1}.pts small{font-size:11px;opacity:.85}
.lock{z-index:1;font:inherit;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600}
.mg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:8px 10px;margin-top:10px}
.mg b{color:var(--red)}
.tabs{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.tab{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;font:inherit;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:var(--sh)}
.tab.on{border-color:var(--red);background:linear-gradient(135deg,var(--red2),#d23a33);color:#fff}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--gold);color:#2a1a14;flex:none}
.tab span{font-size:12px;opacity:.8;display:block}.tab b{font-size:15px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.prog{display:flex;gap:8px;margin-bottom:10px}
.st{flex:1;background:var(--bg2);border-radius:12px;padding:6px 8px;text-align:center;font-size:11px;color:var(--mut)}.st b{display:block;font-size:19px;color:var(--ink)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok))}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{position:relative;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px 3px 6px;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);transition:transform .12s}
.cell.c{cursor:pointer}.cell.c:active{transform:scale(.94)}
.cell .e{font-size:25px;line-height:1.1}.cell .t{font-size:10.5px;line-height:1.15;margin-top:3px}
.n{position:absolute;top:3px;left:6px;font-size:10px;font-weight:700;color:var(--mut)}
.pp{position:absolute;top:3px;right:4px;font-size:9px;font-weight:800;border-radius:8px;padding:0 5px;color:#2a1a14}
.b{background:#cf955f}.s{background:#c6ced6}.g{background:var(--gold)}
.cell.on{background:linear-gradient(160deg,#37a672,#25794f);border-color:#1d6040;color:#fff}.cell.on .n{color:#d8f5e5}
.cell.on::after{content:"✔";position:absolute;bottom:2px;right:5px;font-size:12px}
.cell.free{background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;border-color:var(--red2)}.cell.free .n{color:#fff}
.cell.hot{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,168,23,.45)}
.cell.ln{box-shadow:0 0 0 3px var(--vio)}
.cell.hot.ln{box-shadow:0 0 0 3px var(--vio),0 0 0 6px rgba(226,168,23,.45)}
.cell.sel{outline:3px dashed var(--red);outline-offset:2px}
.tag{position:absolute;bottom:2px;left:3px;font-size:9px;font-weight:800;background:var(--gold);color:#2a1a14;border-radius:6px;padding:0 4px}
.leg{font-size:11px;color:var(--mut);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row:first-of-type{border-top:0}
.row .x{flex:1;min-width:130px}
select,input[type=text],input[type=number]{font:inherit;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:6px 8px}
input[type=text]{flex:1;min-width:110px}
button.a{font:inherit;border-radius:10px;cursor:pointer;background:var(--red);color:#fff;border:0;font-weight:700;padding:7px 12px}
button.a.alt{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.chk{width:22px;height:22px;accent-color:var(--ok)}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
.won{background:var(--ok);color:#fff}.lost{background:#777;color:#fff}.open{background:var(--gold);color:#2a1a14}
.small{font-size:12px;color:var(--mut)}
.wk{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px}.wk .big{font-size:30px}
.ban{background:linear-gradient(90deg,var(--vio),#b24ee0);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:10px;text-align:center}
.err{color:var(--red);font-size:12px;margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.ov.s{display:flex}
.box{background:var(--card);border-radius:18px;padding:20px;max-width:320px;width:100%;text-align:center}
.box input{width:100%;margin:10px 0;text-align:center}
.cell.nw{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell.c:hover,.cell.i:hover{transform:translateY(-2px) scale(1.04);cursor:pointer}
.cell.hot{animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(226,168,23,.12)}}
.cell.hint{animation:hint 1s infinite;border-color:var(--vio)}
@keyframes hint{50%{transform:scale(1.07);background:rgba(122,59,209,.2)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
.lv{display:flex;align-items:center;gap:10px}.lv .big{font-size:36px}
.bdg{display:flex;flex-wrap:wrap;gap:6px}.bd{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--bg2);color:var(--mut);filter:grayscale(1);opacity:.6}.bd.on{filter:none;opacity:1;background:var(--gold);color:#2a1a14}
.vs{display:flex;height:28px;border-radius:14px;overflow:hidden;font-size:12px;font-weight:800;color:#fff}.vs div{display:flex;align-items:center;justify-content:center;transition:width .6s;min-width:40px}
.coin{font-size:84px;display:inline-block;animation:flip 1.6s ease-in-out}
@keyframes flip{to{transform:rotateY(1800deg)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;z-index:30;box-shadow:var(--sh);animation:tin .4s;max-width:92vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
body{background:linear-gradient(180deg,#9fd0ee 0,#cfe6d3 220px,var(--bg) 420px);background-color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(180deg,#27405a 0,#2a3a30 220px,var(--bg) 420px)}}
.hero{background:linear-gradient(135deg,#7e1211,#c4302b);border:3px solid #ffd45a}
.sign{z-index:1;background:linear-gradient(#8a5a2b,#6b4120);border:3px solid #4a2c12;border-radius:10px;color:#fff3d6;font-weight:900;font-size:13px;line-height:1.15;text-align:center;padding:7px 10px;transform:rotate(-3deg);text-shadow:0 1px 0 #3a210c;box-shadow:0 3px 0 #3a210c}
.board{background:linear-gradient(#f7e7c6,#efd9a9);border:7px solid #7b4a22;box-shadow:0 0 0 3px #4a2c12,var(--sh);border-radius:22px;padding:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board{background:linear-gradient(#4a3828,#3a2b1f)}}
.scene{display:flex;justify-content:space-around;align-items:flex-end;font-size:30px;background:linear-gradient(#bfe3f7,#e5f3d8);border-radius:14px;padding:6px 8px 2px;margin-bottom:10px;border-bottom:4px solid #6aa84f}
.scene span:nth-child(2){font-size:40px}.scene span:nth-child(4){font-size:38px}
.board .cell{background:#fffaf0;border:2px solid #d9c196;border-radius:12px;box-shadow:0 3px 0 #cdb384;padding-top:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board .cell{background:#3d2e24;border-color:#5a4434;box-shadow:0 3px 0 #2a1d15}}
.board .cell .e{font-size:28px;background:rgba(226,168,23,.16);border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
.board .cell .t{font-weight:700;font-size:10.5px}
.board .n{top:3px;left:4px;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px}
.board .cell.on{background:linear-gradient(160deg,#3bb27a,#1f7149);box-shadow:0 3px 0 #14502f}.board .cell.on .e{background:rgba(255,255,255,.25)}.board .cell.on .n{background:#fff;color:#1f7149}
.board .cell.free{background:linear-gradient(160deg,#d23a33,#8f1514);box-shadow:0 3px 0 #5e0d0c}.board .cell.free .e{background:rgba(255,255,255,.2)}.board .cell.free .n{background:#fff;color:var(--red)}
.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
@media(max-width:560px){.rw{grid-template-columns:repeat(2,1fr)}}
.rt{background:linear-gradient(#b3201f,#7e1211);color:#fff;border-radius:12px;padding:8px 6px;text-align:center;font-size:10.5px;line-height:1.2;opacity:.75;border:2px solid #ffd45a}
.rt b{display:block;font-size:12.5px;color:#ffd45a;margin:2px 0}.rt .ri{font-size:26px}
.rt.on{opacity:1;box-shadow:0 0 14px #ffd45a;animation:pulse 1.8s infinite}
</style></head><body><div class="w" id="app"></div>
<canvas id="cf"></canvas><div class="ov" id="ov2"><div class="box" id="b2"></div></div><div class="ov" id="ov"><div class="box"><div style="font-size:40px">🔒</div><h2>Režim vedenia</h2><div class="small">Zadaj heslo</div>
<input type="password" id="pw" style="font:inherit;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:8px"><div class="err" id="pe"></div>
<button class="a" id="pgo">Odomknúť</button> <button class="a alt" id="pno">Zrušiť</button></div></div>
<script>
const PW="Klik2026";
const D=[["🏠","Sjednaj Generali domácnosť",1],["🏡","Sjednaj Generali nemovitost",1],["💰","Generali smlouva nad 300 €",2],["✅","3 Generali smlouvy za den",2],["🏢","Sjednaj Generali byt",1],
["🏘️","Sjednaj Generali dům",1],["📅","5 Generali smluv za týden",2],["🎯","Splň 100 % denního cíle",2],["🏞️","Sjednaj Generali chata / chalupa",1],["🏷️","Využitá sleva za pripojištění (jiná smlouva v Generali)",2],
["🛡️","Den bez storna a oprav",2],["🔗","2 Generali smlouvy po sobě",2],["★","GENERALI FREE",0],["👵","Sjednej Generali klientovi 50+",1],["📈","5 smluv celkem za den",2],
["🗓️","Generali smlouva v pondělí",1],["✔️","Generali 3 dny po sobě",2],["📊","Týdenní konverze nad 14 %",3],["💳","Generali roční platba",1],["👥","2 pojistky v 1 hovoru / pro jednu osobu",3],
["🪙","Generali 2 000 € za měsíc",3],["📚","Generali 10 smluv za měsíc",3],["🔥","5 dní splněný denní cíl",3],["🏆","Nejvyšší denní Generali GWP",3],["🎉","Generali smlouva v pátek",1]];
const EZ={3:"Generali smlouva nad 200 €",4:"2 Generali smlouvy za den",7:"4 Generali smlouvy za týden",15:"4 smlouvy celkem za den",17:"Generali 2 dny po sobě",18:"Týdenní konverze nad 12 %",21:"Generali 1 500 € za měsíc",22:"Generali 8 smluv za měsíc",23:"4 dny splněný denní cíl"};
const TP={1:10,2:20,3:30},TC=["","b","s","g"],TN={1:"Bronz",2:"Stříbro",3:"Zlato"};
const DEF={wf:3,wm:"normal",bonus:50,ov:{},ez:{},ops:[{id:"oliver",name:"Oliver Boskovič"},{id:"honza",name:"Honza Treštik"}],
 sh:[{t:"Všetci na SK pod hodinu nepro celý týždeň",f:11,d:0},{t:"Obaja splnený denný/týždenný cieľ",f:8,d:0},{t:"Nad 1 000 € v Generali za týždeň",f:23,d:0}]};
const L=[];for(let i=0;i<5;i++){L.push({id:"r"+i,n:"Riadok "+(i+1),c:[0,1,2,3,4].map(j=>i*5+j)});L.push({id:"c"+i,n:"Stĺpec "+(i+1),c:[0,1,2,3,4].map(j=>j*5+i)})}
let db=null,C=null,O={},cur=null,mg=false,mode="tick",sel=null,err="",hint=false,snd=true,fresh=new Set(),first=true;
try{mg=sessionStorage.getItem("gbmg")=="1"}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cfg=()=>Object.assign(JSON.parse(JSON.stringify(DEF)),C||{});
const od=id=>Object.assign({d:{},dn:{}},O[id]||{});
const fld=(i,c)=>{const o=c.ov[i+1]||{};return{e:D[i][0],t:o.t||D[i][1],tier:o.tier||D[i][2]}};
const lineOk=(l,d)=>l.c.every(i=>d[i]);
function stats(id,c){const o=od(id),d=Object.assign({},o.d);c.sh.forEach(s=>{if(s.d)d[s.f-1]=1});d[12]=1;
 let pts=0,cnt=0;D.forEach((_,i)=>{if(i==12){cnt++;return}if(d[i]){cnt++;const hot=i+1==c.wf&&c.wm=="x2";pts+=TP[fld(i,c).tier]*(hot?2:1)}});
 const ls=L.filter(l=>lineOk(l,d));let bon=0;ls.forEach(l=>{const r=o.dn[l.id];bon+=r=="won"?c.bonus*2:r=="lost"?0:c.bonus});
 return{o,d,pts,cnt,ls,bon,tot:pts+bon}}
async function wr(path,data){if(!db){err="Dáta nie sú dostupné.";render();return}try{await db.doc(path).set(data);err=""}catch(e){err="Uloženie zlyhalo – tvoj účet nemá právo zapisovať (potrebné aspoň Contributor).";render()}}
const setCfg=p=>wr("game/config",Object.assign(cfg(),p));
const setOp=(id,p)=>wr("game/"+id,Object.assign({name:cfg().ops.find(o=>o.id==id)?.name||id},od(id),p));
const opts=sv=>D.map((x,i)=>i==12?"":'<option value="'+(i+1)+'"'+(sv==i+1?" selected":"")+'>'+(i+1)+'</option>').join("");
function render(){
 const c=cfg(),E=mg;if(!cur||!c.ops.find(o=>o.id==cur))cur=c.ops[0].id;
 const S=stats(cur,c),d=S.d,full=new Set();S.ls.forEach(l=>l.c.forEach(i=>full.add(i)));let best=null;L.forEach(l=>{const m=l.c.filter(i=>!d[i]);if(m.length&&(!best||m.length<best.m.length))best={l,m}});
 let g="";
 D.forEach((_,i)=>{const n=i+1,f=fld(i,c);
  if(n==13){g+='<div class="cell free"><span class="n">13</span><span class="e">🦁</span><span class="t">GENERALI FREE</span></div>';return}
  const hot=n==c.wf&&c.wm!="normal";let t=f.t;if(hot&&c.wm=="easy")t="★ "+(c.ez[n]||EZ[n]||f.t+" (zmiernené)");
  const p=TP[f.tier]*(hot&&c.wm=="x2"?2:1);
  g+='<div class="cell'+(E?" c":"")+(d[i]?" on":"")+(hot?" hot":"")+(full.has(i)?" ln":"")+(hint&&best&&best.m.includes(i)?" hint":"")+(fresh.has(i)?" nw":"")+(E?"":" i")+(sel==n&&E&&mode=="edit"?" sel":"")+'" data-a="cell" data-n="'+n+'"><span class="n">'+n+'</span><span class="pp '+TC[f.tier]+'">'+p+'</span><span class="e">'+f.e+'</span><span class="t">'+esc(t)+'</span>'+(hot?'<span class="tag">'+(c.wm=="x2"?"×2":"ľahšie")+'</span>':"")+'</div>'});
 let lh="";S.ls.forEach(l=>{const r=S.o.dn[l.id],v=r=="won"?c.bonus*2:r=="lost"?0:c.bonus;
  lh+='<div class="row"><div class="x">🎉 <b>'+l.n+'</b> <span class="pill '+(r||"open")+'">'+(r=="won"?"Double! "+v+" b.":r=="lost"?"Prepadlo 0 b.":"Bonus "+v+" b.")+'</span></div>'+(E&&!r?'<button class="a" data-a="don" data-l="'+l.id+'">🎲 Double or Nothing</button>':"")+(E&&r?'<button class="a alt" data-a="donr" data-l="'+l.id+'">↺ Reset</button>':"")+'</div>'});
 let h='<div class="hero"><div class="sign">1.–31.<br>OKTÓBER<br>2026</div><div class="l"><h1>GENERALI <span>BINGO</span></h1><div class="sub">SK majetek · 1.–31. október 2026</div></div><div class="pts"><b>'+S.tot+'</b><small>bodov · '+esc(c.ops.find(o=>o.id==cur).name.split(" ")[0])+'</small></div><button class="lock" data-a="lock">'+(E?"🔓 Odhlásiť vedenie":"🔒 Vedenie")+'</button></div>';
 if(E)h+='<div class="mg"><b>Režim vedenia</b><button class="a'+(mode=="tick"?"":" alt")+'" data-a="mode" data-m="tick">✔ Odškrtávanie</button><button class="a'+(mode=="edit"?"":" alt")+'" data-a="mode" data-m="edit">✏️ Úprava polí</button><span class="small">'+(mode=="tick"?"Kliknutím na pole ho odškrtneš.":"Klikni na pole, ktoré chceš upraviť.")+'</span></div>';
 if(err)h+='<div class="err">'+esc(err)+'</div>';
 if(!db)h+='<div class="small" style="margin-top:8px">📌 Zobrazený je uložený stav ('+SNAP.at+'). Živé dáta sa načítajú po prihlásení.</div>';
 h+='<div class="tabs">'+c.ops.map(x=>{const s=stats(x.id,c);return '<button class="tab'+(x.id==cur?" on":"")+'" data-a="tab" data-id="'+x.id+'"><div class="av">'+esc(x.name.split(" ").map(w=>w[0]).join("").slice(0,2))+'</div><div><b>'+esc(x.name)+'</b><span>'+s.cnt+'/25 polí · '+s.tot+' b.</span></div></button>'}).join("")+'</div>';
 h+='<div class="layout"><div><div class="card board"><div class="scene"><span>🏔️</span><span>🏰</span><span>🌲</span><span>🦁</span><span>🏞️</span></div>'+(S.ls.length?'<div class="ban">🎉 '+S.ls.length+'× BINGO!</div>':"")+'<div class="prog"><div class="st"><b>'+S.cnt+'/25</b>polí</div><div class="st"><b>'+S.ls.length+'</b>bingo</div><div class="st"><b>'+S.bon+'</b>bonus b.</div></div><div class="bar"><i style="width:'+Math.round(S.cnt/25*100)+'%"></i></div><div class="grid">'+g+'</div>';
 h+='<div class="leg"><span><i class="b"></i>bronz 10 b.</span><span><i class="s"></i>striebro 20 b.</span><span><i class="g"></i>zlato 30 b.</span><span><i style="background:var(--vio)"></i>bingo riadok/stĺpec</span></div>'+rewards(S)+'</div>';

const SNAP={at:"9. 10. 2026",c:{"bonus": 50, "ez": {}, "ops": [{"id": "oliver", "name": "Oliver Boskovič"}, {"id": "honza", "name": "Honza Treštik"}], "ov": {}, "sh": [{"d": 0, "f": 11, "t": "Všetci na SK pod hodinu nepro celý týždeň"}, {"d": 0, "f": 8, "t": "Obaja splnený denný/týždenný cieľ"}, {"d": 0, "f": 23, "t": "Nad 1 000 € v Generali za týždeň"}], "wf": 3, "wm": "normal"},o:{oliver:{d:{},dn:{}},honza:{d:{},dn:{}}}};
function rewards(S){const k=S.cnt-1,R=[["🎁","První bingo","Menší odměna za 1. dokončenou řadu",S.ls.length>=1],["🎁","Druhé bingo","Další odměna za 2. dokončenou řadu",S.ls.length>=2],["🧰","10 políček","Bonusová odměna za 10 splněných polí",k>=10],["👑","Celá karta","Hlavní výhra za všech 25 úkolů + los do velkého finále",S.cnt==25]];
return '<div class="rw">'+R.map(r=>'<div class="rt'+(r[3]?" on":"")+'"><div class="ri">'+(r[3]?"🔓":r[0])+'</div><b>'+r[1]+'</b><span>'+r[2]+'</span></div>').join("")+'</div>'}
const LV=[[0,"🥉","Nováčik"],[30,"🥈","Poisťovák"],[80,"🥇","Špecialista"],[150,"💎","Majster"],[250,"👑","Legenda"]];
function snapAll(){const c=cfg(),r={};c.ops.forEach(x=>{const s=stats(x.id,c),v=Object.values(s.o.dn);r[x.id]={n:x.name,cnt:s.cnt,ls:s.ls.length,w:v.filter(z=>z=="won").length,l:v.filter(z=>z=="lost").length,d:Object.keys(s.d)}});return r}
function celebrate(a,b){Object.keys(b).forEach(k=>{const p=a[k],n=b[k];if(!p)return;const nm=n.n.split(" ")[0];
 if(k==cur)n.d.forEach(i=>{if(!p.d.includes(i))fresh.add(+i)});
 if(n.w>p.w){burst(220);toast("🎲 "+nm+": DOUBLE! Bonus ×2");tone([523,659,784,1047])}
 else if(n.l>p.l){toast("😅 "+nm+": Nothing… bonus prepadol");tone([300,220])}
 else if(n.ls>p.ls){burst(260);toast("🎉 BINGO! "+nm);tone([523,659,784,1047,1319])}
 else if(n.cnt>p.cnt){burst(50);toast("✅ "+nm+" splnil pole!");tone([660,880])}})}
const cv=document.getElementById("cf"),cx=cv.getContext("2d");let ps=[],raf=0;
function burst(n){cv.width=innerWidth;cv.height=innerHeight;const cols=["#e2a817","#b3201f","#2e9160","#7a3bd1","#ffffff","#ff7a59"];for(let i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[i%6],a:1,rot:Math.random()*6});if(!raf)raf=requestAnimationFrame(step)}
function step(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.a>0&&p.y<cv.height+20);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.006;p.rot+=.2;cx.globalAlpha=Math.max(p.a,0);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});raf=ps.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
let ac=null;function tone(fs){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.14)})}catch(e){}}
function modal(h){document.getElementById("b2").innerHTML=h;document.getElementById("ov2").classList.add("s")}
document.getElementById("ov2").onclick=e=>{if(e.target.id=="ov2"||e.target.dataset.x)document.getElementById("ov2").classList.remove("s")};
function info(n){const c=cfg(),f=fld(n-1,c),S=stats(cur,c),dn=!!S.d[n-1];modal('<div style="font-size:54px">'+f.e+'</div><h2>Pole '+n+'</h2><div>'+esc(n==13?"GENERALI FREE – dostaneš zadarmo":f.t)+'</div><p><span class="pill '+(dn?"won":"open")+'">'+(dn?"Splnené ✔":"Ešte nesplnené")+'</span></p>'+(n==13?"":'<div class="small">'+TN[f.tier]+' · '+TP[f.tier]+' bodov</div>')+'<br><button class="a" data-x="1">OK</button>')}
function flip(l){modal('<div class="coin">🪙</div><h2>Double or Nothing…</h2>');const w=Math.random()<.5;setTimeout(()=>{modal('<div style="font-size:70px">'+(w?"🎉":"😅")+'</div><h2>'+(w?"DOUBLE!":"Nothing…")+'</h2><div class="small">'+(w?"Bonus sa zdvojnásobil.":"Prepadol len bonus, bingo ostáva.")+'</div><br><button class="a" data-x="1">OK</button>');setOp(cur,{dn:Object.assign({},od(cur).dn,{[l]:w?"won":"lost"})})},1700)}
function extra(c,S,best){let h='';const lv=LV.filter(x=>S.tot>=x[0]).pop(),nx=LV[LV.indexOf(lv)+1];
 h+='<div class="card"><h2>⭐ Level</h2><div class="lv"><span class="big">'+lv[1]+'</span><div style="flex:1"><b>'+lv[2]+'</b><div class="bar" style="margin:6px 0 2px"><i style="width:'+(nx?Math.round((S.tot-lv[0])/(nx[0]-lv[0])*100):100)+'%"></i></div><div class="small">'+(nx?"Ešte "+(nx[0]-S.tot)+" b. do levelu "+nx[2]:"Maximálny level!")+'</div></div></div><div class="row"><button class="a'+(hint?"":" alt")+'" data-a="hint">💡 Nápoveda bingo</button><button class="a alt" data-a="snd">'+(snd?"🔊 Zvuk zap.":"🔇 Zvuk vyp.")+'</button></div>'+(hint?'<div class="small">'+(best?"Do bingo chýba "+best.m.length+" pole ("+best.l.n+") – bliká fialovo.":"Máš všetko!")+'</div>':'')+'<div class="small" style="margin-top:6px">Klikni na pole a uvidíš detail.</div></div>';
 const golds=D.filter((_,i)=>S.d[i]&&fld(i,c).tier==3).length,dv=Object.values(S.o.dn),B=[["🌱","Prvé pole",S.cnt>1],["🎉","Bingo",S.ls.length>0],["🥇","3 zlaté polia",golds>=3],["🎲","Odvážlivec",dv.length>0],["🏅","Double Master",dv.includes("won")],["👑","Celá karta",S.cnt==25]];
 h+='<div class="card"><h2>🏅 Odznaky</h2><div class="bdg">'+B.map(b=>'<span class="bd'+(b[2]?" on":"")+'">'+b[0]+' '+b[1]+'</span>').join("")+'</div></div>';
 const A=c.ops.slice(0,2).map(x=>({n:x.name.split(" ")[0],t:stats(x.id,c).tot}));
 if(A.length==2){const pa=Math.max(15,Math.min(85,Math.round(A[0].t/((A[0].t+A[1].t)||1)*100)||50));h+='<div class="card"><h2>⚔️ Súboj</h2><div class="vs"><div style="width:'+pa+'%;background:var(--red)">'+esc(A[0].n)+' '+A[0].t+'</div><div style="width:'+(100-pa)+'%;background:var(--vio)">'+A[1].t+' '+esc(A[1].n)+'</div></div></div>'}
 return h}
const app=document.getElementById("app"),ov=document.getElementById("ov");

app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName=="SELECT"||t.tagName=="INPUT")return;const a=t.dataset.a,c=cfg();
 if(a=="lock"){if(mg){mg=false;try{sessionStorage.removeItem("gbmg")}catch(e){}sel=null;render()}else{document.getElementById("pw").value="";document.getElementById("pe").textContent="";ov.classList.add("s");setTimeout(()=>document.getElementById("pw").focus(),50)}return}

 if(a=="hint"){hint=!hint;render();return}if(a=="snd"){snd=!snd;render();return}if(a=="cell"&&!mg){info(+t.dataset.n);return}if(!mg)return;
 if(a=="mode"){mode=t.dataset.m;sel=null;render()}
 else if(a=="cell"){const n=+t.dataset.n;if(n==13)return;if(mode=="edit"){sel=n;render();return}
  if(c.sh.some(s=>s.d&&s.f==n)){err="Toto pole je odškrtnuté spoločným cieľom.";render();return}err="";
  const dd=Object.assign({},od(cur).d);if(dd[n-1])delete dd[n-1];else dd[n-1]=1;setOp(cur,{d:dd})}
 else if(a=="don")flip(t.dataset.l);
 else if(a=="donr"){const dn=Object.assign({},od(cur).dn);delete dn[t.dataset.l];setOp(cur,{dn})}
 else if(a=="donra"){if(confirm("Resetovať všetky Double or Nothing tohto operátora? Bonus sa vráti na základ."))setOp(cur,{dn:{}})}
 else if(a=="shx"){c.sh.splice(+t.dataset.k,1);setCfg({sh:c.sh})}

 else if(a=="resetop"){if(confirm("Vynulovať kartu tohto operátora?"))setOp(cur,{d:{},dn:{}})}});
app.addEventListener("change",e=>{const t=e.target,a=t.dataset.a,c=cfg();if(!a||!mg)return;
 if(a=="wf")setCfg({wf:+t.value});else if(a=="wm")setCfg({wm:t.value});
 else if(a=="shd"){c.sh[+t.dataset.k].d=t.checked?1:0;setCfg({sh:c.sh})}
 else if(a=="sht"){c.sh[+t.dataset.k].t=t.value;setCfg({sh:c.sh})}
 else if(a=="shf"){c.sh[+t.dataset.k].f=+t.value;setCfg({sh:c.sh})}

render();
